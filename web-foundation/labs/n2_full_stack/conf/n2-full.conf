# n2 · 全链路拓扑：Nginx → 2×Worker → Redis
#
# 后端复用 r3_redis_fanout（Redis 数据面 + 控制面），起两个进程实例；
# Nginx 容器做负载均衡。容器经 host.docker.internal 访问宿主机上的
# uvicorn 进程与 Redis 端口。

upstream backend {
    server host.docker.internal:18901;
    server host.docker.internal:18902;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 8080;

    location / {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_buffering off;                   # SSE 不过缓冲
        proxy_read_timeout 3600s;              # 长连接不被掐
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;         # WebSocket 握手透传
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
