# n1 · 事故配置：proxy_read_timeout 太短（生产最高频的流式事故）
#
# 症状：SSE 流连上了、也能收到前几个事件，然后在静默几秒后被 Nginx 掐断
# （客户端表现为连接被重置/提前结束）。原因：proxy_read_timeout 的计时器
# 在"上游没有新数据"时开始倒数，默认 60s，很多运维会改成 2s/5s——
# 只要上游静默超过它，连接立刻被掐。
#
# 心跳的价值：fastapi.sse 每 15 秒发一条 ": ping" 注释行，读超时定时器
# 随之重置——这就是"心跳防掐"的机制本质。

server {
    listen 8080;

    location / {
        proxy_pass http://host.docker.internal:8807;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 2s;                 # ★ 事故点：上游静默 2 秒即掐断
        proxy_set_header Host $host;
    }

    location /ws/ {
        proxy_pass http://host.docker.internal:8807;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 2s;
    }
}
