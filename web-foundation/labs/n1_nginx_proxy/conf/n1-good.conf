# n1 · 正确的 SSE 反代配置（proxy_buffering off）
# 容器内挂载为 /etc/nginx/conf.d/default.conf 运行

server {
    listen 8080;

    # 容器访问宿主机上的 uvicorn：Docker Desktop 提供 host.docker.internal 域名
    # （Linux 生产环境用 172.17.0.1 或 --network host，README 有说明）
    location / {
        proxy_pass http://host.docker.internal:8807;
        proxy_http_version 1.1;
        proxy_buffering off;                   # ★ 核心一行：不攒缓冲，token 到了就转发
        proxy_read_timeout 3600s;              # ★ SSE 长连接：默认 60s 会掐断空闲流
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket：Upgrade 头透传（协议从 HTTP 换成 WS 的握手必须原样送达）
    location /ws/ {
        proxy_pass http://host.docker.internal:8807;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
