# v8：SSE/WebSocket 友好的 Nginx 反向代理配置
# 用法：docker compose up 后经 http://localhost/ 访问；或本地 nginx -c nginx.conf

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;

    # ---------- 普通 HTTP API ----------
    location / {
        proxy_pass http://api:8807;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---------- SSE：核心是"别缓冲、别掐断" ----------
    location /agent/ {
        proxy_pass http://api:8807;
        proxy_http_version 1.1;
        proxy_set_header Connection "";        # SSE 用普通 keep-alive，不要 upgrade
        proxy_buffering off;                   # ★ 不攒缓冲：token 到了就转发
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;              # ★ 长连接：默认 60s 会掐断空闲流
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    # ---------- WebSocket：核心是"升级头透传" ----------
    location /ws/ {
        proxy_pass http://api:8807;
        proxy_http_version 1.1;                # ★ Upgrade 需要 HTTP/1.1
        proxy_set_header Upgrade $http_upgrade; # ★ 协议升级头
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
