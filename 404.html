<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · 页面不存在 — NorthAdb</title>
<meta name="description" content="页面不存在。返回首页或使用 ⌘K 搜索。">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23FF6363'/><text x='50' y='70' font-size='54' text-anchor='middle' fill='%230A0A0A' font-family='system-ui,sans-serif' font-weight='800'>N</text></svg>">
<link rel="stylesheet" href="css/style.css">
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
</head>
<body data-root="">

<header class="nav" id="nav">
  <div class="nav-inner">
    <a class="brand" href="index.html">
      <span class="brand-mark">N</span>
      <span>NorthAdb</span>
    </a>
    <div class="nav-actions">
      <button class="search-btn" data-cmdk aria-label="搜索">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <span class="search-label">搜索</span>
        <span class="kbd">⌘K</span>
      </button>
    </div>
  </div>
</header>

<main>
  <div class="wrap error-page">
    <div class="error-code">404</div>
    <p>这个页面不存在 —— 可能被移动过，或者从未存在。</p>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
      <a class="btn btn-primary" href="index.html">返回首页</a>
      <button class="btn btn-ghost" data-cmdk>搜索一下 <span class="kbd">⌘K</span></button>
    </div>
  </div>
</main>

<div class="cmdk-overlay" id="cmdk" role="dialog" aria-modal="true" aria-label="搜索">
  <div class="cmdk">
    <input class="cmdk-input" type="text" placeholder="搜索文章、课件与页面…" autocomplete="off" spellcheck="false">
    <ul class="cmdk-list"></ul>
    <div class="cmdk-foot">
      <span><span class="kbd">↑↓</span> 选择</span>
      <span><span class="kbd">↵</span> 打开</span>
      <span><span class="kbd">esc</span> 关闭</span>
    </div>
  </div>
</div>

<script src="js/main.js" defer></script>
</body>
</html>
